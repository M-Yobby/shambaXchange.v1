<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin Dashboard - shambaXchange</title>
    <link rel="stylesheet" href="/styles/main.css">
    <link rel="stylesheet" href="/styles/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../js/header-loader.js"></script>
    <script type="module" src="../js/auth-new.js"></script>
</head>
<body>
    <div id="header-container"></div>

    <div id="dashboard">
        <div class="dashboard-header">
            <h1><i class="fas fa-shield-alt"></i> Admin Dashboard</h1>
        </div>

        <div class="admin-tabs">
            <button class="tab-btn active" data-tab="sponsor">Sponsor Content</button>
            <button class="tab-btn" data-tab="posts">Social Posts</button>
            <button class="tab-btn" data-tab="users">Users</button>
        </div>

        <!-- Sponsor Content Tab -->
        <div id="sponsorTab" class="tab-content active">
            <div class="card">
                <h3>Sponsor Content Moderation</h3>
                <div id="sponsorContentList"></div>
            </div>
        </div>

        <!-- Posts Tab -->
        <div id="postsTab" class="tab-content">
            <div class="card">
                <h3>Social Posts Moderation</h3>
                <div id="postsList"></div>
            </div>
        </div>

        <!-- Users Tab -->
        <div id="usersTab" class="tab-content">
            <div class="card">
                <h3>User Management</h3>
                <div id="usersList"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import api from '../js/api.js';

        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.tab + 'Tab').classList.add('active');
            });
        });

        // Load sponsor content
        async function loadSponsorContent() {
            try {
                const content = await api.getAllSponsorContent();
                const list = document.getElementById('sponsorContentList');
                list.innerHTML = '';

                content.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'admin-item';
                    card.innerHTML = `
                        <div class="admin-item-header">
                            <div>
                                <h4>${item.title}</h4>
                                <p class="text-muted">By ${item.sponsor?.fullName || 'Unknown'}</p>
                            </div>
                            <div class="admin-actions">
                                ${!item.isApproved 
                                    ? `<button class="btn btn-success btn-sm" onclick="approveSponsorContent(${item.id})">
                                        <i class="fas fa-check"></i> Approve
                                      </button>
                                      <button class="btn btn-danger btn-sm" onclick="rejectSponsorContent(${item.id})">
                                        <i class="fas fa-times"></i> Reject
                                      </button>`
                                    : `<span class="badge badge-success">Approved</span>`
                                }
                            </div>
                        </div>
                        <div class="admin-item-content">
                            <p>${item.description}</p>
                            ${item.mediaUrl ? `<img src="${item.mediaUrl}" style="max-width: 200px; margin-top: 0.5rem;">` : ''}
                        </div>
                    `;
                    list.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading sponsor content:', error);
            }
        }

        // Load posts
        async function loadPosts() {
            try {
                const posts = await api.getAllPosts();
                const list = document.getElementById('postsList');
                list.innerHTML = '';

                posts.forEach(post => {
                    const card = document.createElement('div');
                    card.className = 'admin-item';
                    card.innerHTML = `
                        <div class="admin-item-header">
                            <div>
                                <h4>${post.user?.fullName || 'Unknown User'}</h4>
                                <p class="text-muted">${new Date(post.createdAt).toLocaleString()}</p>
                            </div>
                            <button class="btn btn-danger btn-sm" onclick="deletePost(${post.id})">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </div>
                        <div class="admin-item-content">
                            <p>${post.text || ''}</p>
                            ${post.media ? (post.mediaType === 'video' 
                                ? `<video src="${post.media}" controls style="max-width: 300px; margin-top: 0.5rem;"></video>`
                                : `<img src="${post.media}" style="max-width: 300px; margin-top: 0.5rem;">`) 
                                : ''}
                        </div>
                    `;
                    list.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading posts:', error);
            }
        }

        // Load users
        async function loadUsers() {
            try {
                const users = await api.getAllUsers();
                const list = document.getElementById('usersList');
                list.innerHTML = '';

                const table = document.createElement('table');
                table.className = 'admin-table';
                table.innerHTML = `
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Full Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Last Login</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${users.map(user => `
                            <tr>
                                <td>${user.id}</td>
                                <td>${user.username}</td>
                                <td>${user.fullName}</td>
                                <td>${user.email}</td>
                                <td><span class="badge">${user.role}</span></td>
                                <td>${user.isActive ? '<span class="badge badge-success">Active</span>' : '<span class="badge badge-danger">Inactive</span>'}</td>
                                <td>${user.lastLogin ? new Date(user.lastLogin).toLocaleString() : 'Never'}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                `;
                list.appendChild(table);
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        // Global functions for buttons
        window.approveSponsorContent = async (id) => {
            try {
                await api.approveSponsorContent(id);
                alert('Content approved!');
                loadSponsorContent();
            } catch (error) {
                alert('Error approving content: ' + error.message);
            }
        };

        window.rejectSponsorContent = async (id) => {
            if (confirm('Are you sure you want to reject this content?')) {
                try {
                    await api.rejectSponsorContent(id);
                    alert('Content rejected!');
                    loadSponsorContent();
                } catch (error) {
                    alert('Error rejecting content: ' + error.message);
                }
            }
        };

        window.deletePost = async (id) => {
            if (confirm('Are you sure you want to delete this post?')) {
                try {
                    await api.deletePost(id);
                    alert('Post deleted!');
                    loadPosts();
                } catch (error) {
                    alert('Error deleting post: ' + error.message);
                }
            }
        };

        // Initialize
        loadSponsorContent();
        loadPosts();
        loadUsers();
    </script>

    <style>
        .admin-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #e0e0e0;
        }
        .tab-btn {
            padding: 0.8rem 1.5rem;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .tab-btn.active {
            border-bottom-color: var(--primary);
            color: var(--primary);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .admin-item {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .admin-item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 0.5rem;
        }
        .admin-item-header h4 {
            margin: 0;
        }
        .admin-actions {
            display: flex;
            gap: 0.5rem;
        }
        .btn-sm {
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
        }
        .text-muted {
            color: #6c757d;
            font-size: 0.9rem;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
        }
        .admin-table th,
        .admin-table td {
            padding: 0.8rem;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        .admin-table th {
            background: #f8f9fa;
            font-weight: 600;
        }
        .badge {
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            background: #e0e0e0;
        }
        .badge-success {
            background: #4caf50;
            color: white;
        }
        .badge-danger {
            background: #f44336;
            color: white;
        }
        .btn-success {
            background: #4caf50;
            color: white;
        }
        .btn-danger {
            background: #f44336;
            color: white;
        }
    </style>
</body>
</html>
