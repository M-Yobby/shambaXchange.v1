<!-- views/partials/header.html -->
<header class="main-header">
  <div class="container header-content">
    <div class="logo">
      <i class="fas fa-seedling"></i>
      <span>shambaXchange</span>
    </div>
    <nav>
      <ul class="nav-menu" id="navMenu">
        <!-- Navigation links will be populated based on user role -->
      </ul>
    </nav>
    <div class="user-actions">
      <button class="btn" id="notifications-btn" title="Notifications"><i class="fas fa-bell"></i></button>
      <div class="user-profile" id="user-profile">
        <img src="../assets/images/default-avatar.jpg" alt="User" class="user-avatar" id="user-avatar">
        <span class="user-name" id="user-display-name">Guest</span>
      </div>
    </div>
  </div>
</header>
