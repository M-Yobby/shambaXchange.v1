<!-- views/market.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Market - ShambaXchange</title>
  <link rel="stylesheet" href="../styles/main.css">
  <link rel="stylesheet" href="../styles/market.css">
  <link rel="stylesheet" href="../styles/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="/config.js"></script>
  <script src="../js/header-loader.js"></script>
  <script type="module" src="../js/auth-new.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src='https://api.mapbox.com/mapbox-gl-js/v2.9.2/mapbox-gl.js'></script>
  <link href='https://api.mapbox.com/mapbox-gl-js/v2.9.2/mapbox-gl.css' rel='stylesheet' />
</head>
<body>

  <div id="header-container"></div>

  <main class="container main-content">
    <section id="market" class="page-section active">
      <div class="page-title">
        <div class="welcome-message">
          <h1><i class="fas fa-chart-bar"></i> Market Intelligence</h1>
          <div class="location"><i class="fas fa-map-marker-alt"></i> Kenya Market Overview</div>
        </div>
        <button class="btn btn-primary" id="export-data-btn"><i class="fas fa-download"></i> Export Data</button>
      </div>

      <!-- Location Search Bar -->
      <div class="card" style="margin-bottom: 1.5rem;">
        <div class="card-header">
          <h2 class="card-title"><i class="fas fa-search-location"></i> Search by Location</h2>
        </div>
        <div style="padding: 1rem;">
          <div style="display: flex; gap: 1rem; align-items: center;">
            <div style="flex: 1; position: relative;">
              <input 
                type="text" 
                id="location-search" 
                placeholder="Enter your county or location (e.g., Nairobi, Nakuru, Kisumu...)" 
                style="width: 100%; padding: 0.8rem 1rem; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem; color: #333;"
                list="kenya-counties"
              />
              <datalist id="kenya-counties">
                <option value="Nairobi">Nairobi County</option>
                <option value="Nakuru">Nakuru County</option>
                <option value="Kiambu">Kiambu County</option>
                <option value="Kisumu">Kisumu County</option>
                <option value="Mombasa">Mombasa County</option>
                <option value="Uasin Gishu">Uasin Gishu County</option>
                <option value="Kakamega">Kakamega County</option>
                <option value="Machakos">Machakos County</option>
                <option value="Meru">Meru County</option>
                <option value="Nyeri">Nyeri County</option>
              </datalist>
            </div>
            <button id="search-location-btn" class="btn btn-primary" style="padding: 0.8rem 1.5rem;">
              <i class="fas fa-search"></i> Search
            </button>
          </div>
          <div id="location-result" style="margin-top: 1rem; color: #666; font-size: 0.9rem;"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2 class="card-title"><i class="fas fa-map"></i> Regional Market Overview</h2>
          <div id="selected-region-info" style="font-size: 0.9rem; color: #666;">
            <i class="fas fa-location-dot"></i> Click a region on the map to view market data
          </div>
        </div>
        <div class="map-container">
          <div id="kenya-map" style="width: 100%; height: 500px; border-radius: 8px;"></div>
        </div>
      </div>

      <div class="analytics-grid" id="market-analytics">
        <!-- High and Low moving products will be created by JS -->
      </div>

      <div class="card" id="agri-alerts">
        <div class="card-header">
          <h2 class="card-title"><i class="fas fa-bell"></i> Agricultural Alerts</h2>
        </div>
        <div id="alerts-container"></div>
      </div>
    </section>
  </main>

  <script type="module" src="../js/market.js"></script>
</body>
</html>
